<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design Archive — ATU Sligo</title>

<!-- ==========================================================================
     DESIGN ARCHIVE — HUB / landing page
     The front door to the catalogues. Self-contained, static.
     Deploy this as the ROOT index.html of the master folder (Digital Archive Website/):

       Digital Archive Website/
       ├── index.html            (this file)
       ├── viewer/               (shared SuperSplat viewer bundle)
       ├── architecture/         (portal: index.html + projects.json)
       ├── interior-architecture/
       ├── creative-design/
       ├── fine-art/
       ├── models/  posters/

     Edit HUB and CATALOGUES below to change titles, copy, tiles and links.
     ========================================================================== -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Inter:wght@400;450;500&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#F7F7F5; --paper-2:#FFFFFF;
    --ink:#17191A; --slate:#63696B;
    --hair:#E3E1DB; --teal:#2E5E5B; --teal-tint:#EAF0EF;
    --shadow:0 1px 2px rgba(23,25,26,.05); --sheet:1180px;
  }
  html[data-theme="dark"]{
    --paper:#101213; --paper-2:#181B1C;
    --ink:#ECEDEC; --slate:#969B9C;
    --hair:#282C2D; --teal:#66ABA4; --teal-tint:#1A2A28;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Inter",system-ui,sans-serif;font-weight:400;line-height:1.55;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
  a{color:inherit;text-decoration:none}
  .sheet{max-width:var(--sheet);margin:0 auto;padding:0 28px}

  /* strip */
  .strip{display:flex;justify-content:space-between;align-items:center;padding:22px 0 0}
  .logo{display:inline-flex;align-items:center;height:34px}
  .logo img{height:34px;width:auto;display:block}
  .logo-mark{font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:15px;letter-spacing:.14em;border:1.5px solid var(--ink);padding:6px 11px 5px;border-radius:3px}
  .theme{appearance:none;background:none;border:1px solid var(--hair);border-radius:999px;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);transition:border-color .15s}
  .theme:hover{border-color:var(--slate)}
  .theme svg{width:17px;height:17px}

  /* hero */
  .hero{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;padding:40px 0 8px}
  .eyebrow{font-size:13.5px;color:var(--slate);line-height:1.5}
  .eyebrow strong{color:var(--ink);font-weight:500}
  .archive-title{font-family:"Space Grotesk",sans-serif;font-weight:500;font-size:clamp(44px,8vw,88px);letter-spacing:-.03em;line-height:.98;margin:18px 0 0}
  .lede{max-width:46ch;margin:24px 0 0;font-size:17px;line-height:1.62;color:var(--slate)}
  .lede b{color:var(--ink);font-weight:450}
  .cloud-panel{position:relative;aspect-ratio:1/1;border:1px solid var(--hair);border-radius:6px;overflow:hidden;background:var(--paper-2);box-shadow:var(--shadow)}
  #cloud{position:absolute;inset:0;width:100%;height:100%;display:block}
  .cloud-tag{position:absolute;left:16px;bottom:14px;font-size:11.5px;color:var(--slate);letter-spacing:.02em}

  .rule{height:1px;background:var(--ink);margin:52px 0 0}

  /* catalogues */
  .cat-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:40px 0 24px}
  .cat-head h2{font-family:"Space Grotesk",sans-serif;font-weight:500;font-size:22px;letter-spacing:-.01em;margin:0}
  .cat-head span{font-size:13.5px;color:var(--slate)}
  .cats{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding-bottom:8px}
  .cat{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:236px;padding:26px;border:1px solid var(--hair);border-radius:4px;background:var(--paper-2);overflow:hidden;transition:border-color .2s,transform .2s,box-shadow .2s}
  .cat:hover,.cat:focus-visible{border-color:var(--teal);transform:translateY(-2px);box-shadow:0 10px 30px -18px rgba(23,25,26,.4);outline:none}
  .cat .accent{position:absolute;top:0;left:0;right:0;height:3px;background:hsl(var(--h) 42% 46%)}
  .cat .glyph{position:absolute;top:-24px;right:2px;font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:190px;line-height:1;color:hsl(var(--h) 40% 45%);opacity:.06;pointer-events:none;user-select:none}
  html[data-theme="dark"] .cat .glyph{opacity:.11}
  .cat .cat-name{font-family:"Space Grotesk",sans-serif;font-weight:500;font-size:26px;letter-spacing:-.015em;line-height:1.08;margin:0;position:relative}
  .cat .cat-desc{font-size:14.5px;color:var(--slate);margin:10px 0 0;max-width:34ch;position:relative}
  .cat .enter{font-size:13.5px;color:var(--teal);margin-top:16px;position:relative;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}

  /* about */
  .about{display:grid;grid-template-columns:1fr 1fr;gap:44px;margin:64px 0 0;padding-top:36px;border-top:1px solid var(--hair)}
  .about h3{font-family:"Space Grotesk",sans-serif;font-weight:500;font-size:19px;margin:0 0 12px}
  .about p{margin:0;color:var(--slate);font-size:15.5px;line-height:1.66;max-width:52ch}
  .about p + p{margin-top:14px}

  footer{margin-top:66px;border-top:1px solid var(--hair);padding:24px 0 48px;color:var(--slate);font-size:13.5px}
  footer .sheet{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

  @media (max-width:820px){
    .hero{grid-template-columns:1fr;gap:30px;padding-top:30px}
    .cloud-panel{aspect-ratio:16/10;order:-1}
    .cats{grid-template-columns:1fr}
    .about{grid-template-columns:1fr;gap:26px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div class="sheet">
  <div class="strip">
    <a class="logo" href="#" aria-label="ATU Sligo"><img id="logo-img" src="logo.svg" alt="ATU Sligo"></a>
    <button class="theme" id="theme-btn" aria-label="Switch colour theme"></button>
  </div>
</div>

<header class="sheet">

<main class="sheet">
  <div class="rule"></div>
  <div class="cat-head"><h2>Catalogues</h2><span id="cat-count"></span></div>

    </div>
    <div>
      <h3>How to view</h3>
      <p id="about-2"></p>
    </div>
  </section>
</main>

<footer>

  about2:"Every scene is a 3D Gaussian splat in SOG format, hosted here at the library. It opens in any modern browser with no plugins or downloads — orbit with a drag, zoom with the wheel, and step inside where walk mode is enabled.",

  logo:"logo.png"

  cats.appendChild(a);
});
