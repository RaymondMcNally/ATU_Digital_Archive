<title>Design Archive — ATU Sligo</title>

<!-- ==========================================================================
     DESIGN ARCHIVE — HUB / landing page
     The front door to the catalogues. Self-contained, static.
     Deploy this as the ROOT index.html of the master folder (Digital Archive Website/):

       Digital Archive Website/
       ├── index.html            (this file)
       ├── viewer/               (shared SuperSplat viewer bundle)
       ├── architecture/         (portal: index.html + projects.json)
       ├── interior-architecture/
       ├── creative-design/
       ├── fine-art/
       ├── models/  posters/

     Edit HUB and CATALOGUES below to change titles, copy, tiles and links.
     ========================================================================== -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Inter:wght@400;450;500&display=swap" rel="stylesheet">

<style>
  :root{
    --paper:#F7F7F5; --paper-2:#FFFFFF;
    --ink:#17191A; --slate:#63696B;
    --hair:#E3E1DB; --teal:#2E5E5B; --teal-tint:#EAF0EF;
    --shadow:0 1px 2px rgba(23,25,26,.05); --sheet:1180px;
  }
  html[data-theme="dark"]{
    --paper:#101213; --paper-2:#181B1C;
    --ink:#ECEDEC; --slate:#969B9C;
    --hair:#282C2D; --teal:#66ABA4; --teal-tint:#1A2A28;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Inter",system-ui,sans-serif;font-weight:400;line-height:1.55;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
  a{color:inherit;text-decoration:none}
  .sheet{max-width:var(--sheet);margin:0 auto;padding:0 28px}

  /* strip */
  .strip{display:flex;justify-content:space-between;align-items:center;padding:22px 0 0}
  .logo{display:inline-flex;align-items:center;height:34px}
  .logo img{height:34px;width:auto;display:block}
  .logo-mark{font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:15px;letter-spacing:.14em;border:1.5px solid var(--ink);padding:6px 11px 5px;border-radius:3px}
  .theme{appearance:none;background:none;border:1px solid var(--hair);border-radius:999px;width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);transition:border-color .15s}
  .theme:hover{border-color:var(--slate)}
  .theme svg{width:17px;height:17px}

  /* hero */
  .hero{display:grid;grid-template-columns:1.15fr .85fr;gap:48px;align-items:center;padding:40px 0 8px}
  .eyebrow{font-size:13.5px;color:var(--slate);line-height:1.5}
  .eyebrow strong{color:var(--ink);font-weight:500}
  .archive-title{font-family:"Space Grotesk",sans-serif;font-weight:500;font-size:clamp(44px,8vw,88px);letter-spacing:-.03em;line-height:.98;margin:18px 0 0}
  .lede{max-width:46ch;margin:24px 0 0;font-size:17px;line-height:1.62;color:var(--slate)}
  .lede b{color:var(--ink);font-weight:450}
  .cloud-panel{position:relative;aspect-ratio:1/1;border:1px solid var(--hair);border-radius:6px;overflow:hidden;background:var(--paper-2);box-shadow:var(--shadow)}
  #cloud{position:absolute;inset:0;width:100%;height:100%;display:block}
  .cloud-tag{position:absolute;left:16px;bottom:14px;font-size:11.5px;color:var(--slate);letter-spacing:.02em}

  .rule{height:1px;background:var(--ink);margin:52px 0 0}

  /* catalogues */
  .cat-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin:40px 0 24px}
  .cat-head h2{font-family:"Space Grotesk",sans-serif;font-weight:500;font-size:22px;letter-spacing:-.01em;margin:0}
  .cat-head span{font-size:13.5px;color:var(--slate)}
  .cats{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding-bottom:8px}
  .cat{position:relative;display:flex;flex-direction:column;justify-content:flex-end;min-height:236px;padding:26px;border:1px solid var(--hair);border-radius:4px;background:var(--paper-2);overflow:hidden;transition:border-color .2s,transform .2s,box-shadow .2s}
  .cat:hover,.cat:focus-visible{border-color:var(--teal);transform:translateY(-2px);box-shadow:0 10px 30px -18px rgba(23,25,26,.4);outline:none}
  .cat .accent{position:absolute;top:0;left:0;right:0;height:3px;background:hsl(var(--h) 42% 46%)}
  .cat .glyph{position:absolute;top:-24px;right:2px;font-family:"Space Grotesk",sans-serif;font-weight:600;font-size:190px;line-height:1;color:hsl(var(--h) 40% 45%);opacity:.06;pointer-events:none;user-select:none}
  html[data-theme="dark"] .cat .glyph{opacity:.11}
  .cat .cat-name{font-family:"Space Grotesk",sans-serif;font-weight:500;font-size:26px;letter-spacing:-.015em;line-height:1.08;margin:0;position:relative}
  .cat .cat-desc{font-size:14.5px;color:var(--slate);margin:10px 0 0;max-width:34ch;position:relative}
  .cat .enter{font-size:13.5px;color:var(--teal);margin-top:16px;position:relative;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}

  /* about */
  .about{display:grid;grid-template-columns:1fr 1fr;gap:44px;margin:64px 0 0;padding-top:36px;border-top:1px solid var(--hair)}
  .about h3{font-family:"Space Grotesk",sans-serif;font-weight:500;font-size:19px;margin:0 0 12px}
  .about p{margin:0;color:var(--slate);font-size:15.5px;line-height:1.66;max-width:52ch}
  .about p + p{margin-top:14px}

  footer{margin-top:66px;border-top:1px solid var(--hair);padding:24px 0 48px;color:var(--slate);font-size:13.5px}
  footer .sheet{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}

  @media (max-width:820px){
    .hero{grid-template-columns:1fr;gap:30px;padding-top:30px}
    .cloud-panel{aspect-ratio:16/10;order:-1}
    .cats{grid-template-columns:1fr}
    .about{grid-template-columns:1fr;gap:26px}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<!-- ==========================================================================
     INTRO SPLASH — gate. Runs before paint so the hub never flashes first.
     Plays once per browser session. Add ?intro to the URL to replay it.
     ========================================================================== -->
<script>
(function(){
  var d=document.documentElement;
  try{ var t=localStorage.getItem('archive-theme'); if(t) d.setAttribute('data-theme',t);
       else if(matchMedia('(prefers-color-scheme: dark)').matches) d.setAttribute('data-theme','dark'); }catch(e){}
  var force=/[?&]intro\b/.test(location.search);
  var seen=false; try{ seen=sessionStorage.getItem('archive-intro-seen')==='1'; }catch(e){}
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(force || (!seen && !reduce)){
    d.classList.add('intro-pending');
    /* safety net: if three.js can't load (offline, blocked CDN) show the hub anyway */
    setTimeout(function(){ if(!window.__introStarted) d.classList.remove('intro-pending'); },3500);
  }
})();
</script>
<style>
  html.intro-pending body,html.intro-open body{overflow:hidden}
  html.intro-pending body::after{content:"";position:fixed;inset:0;background:var(--paper);z-index:999}

  #intro{position:fixed;inset:0;z-index:1000;background:var(--paper);color:var(--ink);
    display:grid;grid-template-rows:auto 1fr auto;padding:22px max(28px,4vw) max(30px,4vh);
    transition:opacity .85s cubic-bezier(.4,0,.2,1)}
  #intro-gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #intro > *:not(canvas){position:relative;pointer-events:none}
  #intro button{pointer-events:auto}

  .intro-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
  .intro-inst{margin:0;font-size:13.5px;line-height:1.5;color:var(--slate)}
  .intro-inst strong{color:var(--ink);font-weight:500}
  .intro-skip{white-space:nowrap;appearance:none;background:none;border:0;padding:6px 0;font:inherit;font-size:13.5px;color:var(--slate);
    cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px}
  .intro-skip:hover{color:var(--ink)}

  .intro-bottom{grid-row:3;display:flex;justify-content:space-between;align-items:flex-end;gap:32px;flex-wrap:wrap}
  .intro-title{font-family:"Space Grotesk",sans-serif;font-weight:500;font-size:clamp(52px,8.6vw,132px);
    letter-spacing:-.045em;line-height:.9;margin:0;opacity:0;transform:translateY(.12em);
    transition:opacity 1.1s ease,transform 1.4s cubic-bezier(.16,1,.3,1),letter-spacing 1.8s cubic-bezier(.16,1,.3,1)}
  .intro-lede{max-width:40ch;margin:18px 0 0;font-size:16px;line-height:1.6;color:var(--slate);opacity:0;transition:opacity 1s ease .35s}
  #intro.titled .intro-title{opacity:1;transform:none;letter-spacing:-.035em}
  #intro.titled .intro-lede{opacity:1}

  .intro-cta{display:flex;flex-direction:column;align-items:flex-end;gap:14px}
  .intro-feature{text-align:right;opacity:0;transform:translateY(6px);transition:opacity .9s ease,transform 1s cubic-bezier(.16,1,.3,1)}
  .intro-feature p{margin:0}
  .intro-f-title{font-family:"Space Grotesk",sans-serif;font-weight:500;font-size:19px;letter-spacing:-.01em;color:var(--ink)}
  .intro-f-by{font-size:13.5px;color:var(--slate);margin-top:2px}
  #intro.featured .intro-feature{opacity:1;transform:none}
  .intro-readout{margin:0;font-size:13px;color:var(--slate);font-variant-numeric:tabular-nums}
  .intro-readout b{color:var(--teal);font-weight:500}
  .intro-enter{appearance:none;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);
    font-family:"Space Grotesk",sans-serif;font-weight:500;font-size:17px;letter-spacing:-.005em;
    padding:14px 26px 13px;border-radius:4px;cursor:pointer;opacity:0;transform:translateY(8px);visibility:hidden;
    transition:opacity .6s ease,transform .6s cubic-bezier(.16,1,.3,1),background .2s,border-color .2s,visibility 0s .6s}
  #intro.ready .intro-enter{opacity:1;transform:none;visibility:visible;transition-delay:0s}
  .intro-enter:hover{background:var(--teal);border-color:var(--teal)}
  #intro button:focus-visible{outline:2px solid var(--teal);outline-offset:4px}

  #intro.leaving .intro-top,#intro.leaving .intro-bottom{opacity:0;transition:opacity .35s ease}
  #intro.gone{opacity:0}

  @media (max-width:700px){
    .intro-bottom{flex-direction:column;align-items:stretch;gap:22px}
    .intro-cta{align-items:stretch}
    .intro-feature{text-align:left}
    .intro-lede{font-size:15px}
  }
</style>

     Enter dives through the cloud into the hub.

<script type="module">
/* EDIT HERE — the featured scan the logo turns into.
   axes maps the scan's axes to screen right, up, toward-viewer ("z,-y,x" means
   right = scan z, up = minus scan y, toward you = scan x). Change it if a model
   comes in sideways or upside down. */
const FEATURE = {
  src:   'models/architecture/Sligo Train Station Model.sog',
  title: 'Sligo Transportation Hub',
  by:    'Li Ling',
  note:  'Studio 5, 2025/26',
  axes:  'z,-y,x'

const root = document.documentElement;

if (root.classList.contains('intro-pending')) startIntro();

async function startIntro(){

  if (!root.classList.contains('intro-pending')) return;
  window.__introStarted = true;

  const MOBILE = Math.min(innerWidth, innerHeight) < 700;
  const N = MOBILE ? 32000 : 70000;

      seed[i*4+2] = Math.min(1, Math.max(0, (y + 0.9) / 2.0)) + Math.random() * 0.12;   // ground first
    }
    ['position','aScan','aSize','aSeed'].forEach(n => geo.attributes[n].needsUpdate = true);
    return true;
  }

  /* ---------- back-to-front ordering so the scan composites like a splat ---------- */
  const keys = new Uint16Array(N), counts = new Uint32Array(65536), camL = new THREE.Vector3(), fwd = new THREE.Vector3();
  function sortSplats(m){
    camL.copy(camera.position); group.worldToLocal(camL);
    fwd.set(0, 0, 0).sub(camL).normalize();
    let mn = Infinity, mx = -Infinity; const dep = sortSplats.d || (sortSplats.d = new Float32Array(N));
    for (let i = 0; i < N; i++){
      const x = logo[i*3] + (scanPos[i*3] - logo[i*3]) * m, y = logo[i*3+1] + (scanPos[i*3+1] - logo[i*3+1]) * m, z = logo[i*3+2] + (scanPos[i*3+2] - logo[i*3+2]) * m;
      const v = (x - camL.x) * fwd.x + (y - camL.y) * fwd.y + (z - camL.z) * fwd.z;
      dep[i] = v; if (v < mn) mn = v; if (v > mx) mx = v;
    }
    const sc = 65535 / Math.max(1e-6, mx - mn); counts.fill(0);
    for (let i = 0; i < N; i++){ const kk = 65535 - ((dep[i] - mn) * sc | 0); keys[i] = kk; counts[kk]++; }   // far first
    for (let i = 1; i < 65536; i++) counts[i] += counts[i-1];
    for (let i = N - 1; i >= 0; i--) idx[--counts[keys[i]]] = i;
    index.needsUpdate = true;
  }

  /* ---------- pointer ---------- */
  const ZERO = new THREE.Vector2(), ndc = new THREE.Vector2(9, 9), sm = new THREE.Vector2(), ray = new THREE.Raycaster();
  const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0), hit = new THREE.Vector3();
  let pointerIn = false;
  const onMove = e => { ndc.set(e.clientX / W * 2 - 1, -(e.clientY / Hh) * 2 + 1); pointerIn = true; };
  addEventListener('pointermove', onMove); addEventListener('pointerdown', onMove);
  document.addEventListener('pointerleave', () => pointerIn = false);

  /* ---------- enter / skip ---------- */
  let exitAt = null, t0 = performance.now(), raf, lastCount = -1, titled = false, ready = false, frameNo = 0, swapped = false;
  function enter(){
    if (exitAt !== null) return;
    exitAt = performance.now();
    try { sessionStorage.setItem('archive-intro-seen', '1'); } catch(e){}
    el.classList.add('leaving');
    setTimeout(() => el.classList.add('gone'), 550);
    setTimeout(cleanup, 1450);
  }
  enterBtn.addEventListener('click', enter); skipBtn.addEventListener('click', enter);
  const onKey = e => { if (e.key === 'Escape' || (ready && (e.key === 'Enter' || e.key === ' ') && document.activeElement === document.body)) enter(); };
  const onWheel = e => { if (ready && e.deltaY > 25) enter(); };
  addEventListener('keydown', onKey); addEventListener('wheel', onWheel, { passive:true });

  const sm01 = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
  function frame(now){
    const t = (now - t0) / 1000; frameNo++;
    uniforms.uTime.value = t;

    if (morphStart === null && scanReady && t > MORPH_AT) morphStart = t;
    const st = morphStart === null ? -1 : t - morphStart;
    uniforms.uScanT.value = st;
    const m = sm01(st / 2.7);                                   // overall morph progress

    if (morphStart === null){
      let lo = 0, hi = N; while (lo < hi){ const k = (lo + hi) >> 1; if (ends[k] <= t) lo = k + 1; else hi = k; }
      if (lo !== lastCount){ lastCount = lo; countEl.textContent = fmt(lo); }
    } else if (!swapped && st > 1.2){
      swapped = true; el.classList.add('featured');
      countEl.textContent = fmt(scanCount); countLabel.textContent = 'splats from a 3D scan';
    }
    if (!titled && t > 1.1){ titled = true; el.classList.add('titled'); }
    if (!ready && t > 2.4){ ready = true; el.classList.add('ready'); }

    sm.lerp(pointerIn ? ndc : ZERO, 0.05);
    const ex = exitAt === null ? 0 : Math.min(1, (now - exitAt) / 1300);
    uniforms.uExit.value = ex;
    // camera: gentle sway for the logo, a wider slow orbit looking down on the model
    const az = Math.sin(t * 0.17) * (0.26 + m * 0.34) + sm.x * 0.14;
    const el2 = 0.06 + m * 0.2 + Math.sin(t * 0.11) * 0.04 + sm.y * 0.08;
    const r = dist * (1 - ex * ex * 0.55);
    camera.position.set(Math.sin(az) * Math.cos(el2) * r, Math.sin(el2) * r, Math.cos(az) * Math.cos(el2) * r);
    camera.lookAt(0, 0, 0);

    ray.setFromCamera(sm, camera);
    if (ray.ray.intersectPlane(plane, hit)){ group.worldToLocal(hit); uniforms.uMouse.value.copy(hit); }
    uniforms.uMouseStr.value += ((pointerIn && ex === 0 ? 1 : 0) - uniforms.uMouseStr.value) * 0.06;

    if (morphStart !== null && frameNo % 2 === 0) sortSplats(m);
    renderer.render(scene, camera);
    raf = requestAnimationFrame(frame);
  }
  raf = requestAnimationFrame(frame);

  function cleanup(){
    cancelAnimationFrame(raf);
    removeEventListener('resize', resize); removeEventListener('pointermove', onMove); removeEventListener('pointerdown', onMove);
    removeEventListener('keydown', onKey); removeEventListener('wheel', onWheel);
    geo.dispose(); mat.dispose(); renderer.dispose(); renderer.forceContextLoss();
    el.remove(); root.classList.remove('intro-open');
  }

  /* ---------- logo sampling (waves tilt forward as a ground plane) ---------- */
  async function sampleLogo(src, n){
    const out = new Float32Array(n * 3);
    let px = null, w = 0, h = 0;
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
      h = 420; w = Math.round(h * img.naturalWidth / img.naturalHeight);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const cx = c.getContext('2d', { willReadFrequently:true }); cx.drawImage(img, 0, 0, w, h);
      const data = cx.getImageData(0, 0, w, h).data; px = [];
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
        const k = (y * w + x) * 4;
        if (data[k+3] > 150 && data[k] + data[k+1] + data[k+2] < 600) px.push(x, y);
      }
      if (px.length < 200) px = null;
    } catch(e){ px = null; }
    for (let i = 0; i < n; i++){
      let x, y;
      if (px){ const k = (Math.random() * (px.length / 2) | 0) * 2; x = (px[k] + Math.random() - w / 2) / (h / 2); y = -(px[k+1] + Math.random() - h / 2) / (h / 2); }
      else if (typeof LOGO !== 'undefined'){ const k = (Math.random() * (LOGO.length / 2) | 0) * 2; x = LOGO[k] / 1000 + (Math.random() - .5) * .03; y = -LOGO[k+1] / 1000 + (Math.random() - .5) * .03; }
      else { x = (Math.random() - .5) * 1.6; y = (Math.random() - .5) * 2; }
      let z = (Math.random() - .5) * 0.05;
      if (y < -0.3) z += (-0.3 - y) * 0.55;
      out.set([x, y, z], i * 3);
    }
    return out;
  }
}

/* ---------- SOG (v2) reader: zip → webp textures → splat positions, colours, sizes ----------
   Images are decoded through WebGL so colour indices and opacity survive exactly
   (a 2D canvas would premultiply alpha and corrupt them). */
async function readSOG(bytes, renderer){
  const files = await unzip(bytes);
  if (!files['meta.json']) return null;
  const meta = JSON.parse(new TextDecoder().decode(files['meta.json']));
  if (meta.version !== 2) return null;
  const gl = renderer.getContext();
  const pixels = async name => {
    const bmp = await createImageBitmap(new Blob([files[name]], { type:'image/webp' }), { premultiplyAlpha:'none', colorSpaceConversion:'none' });
    const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false); gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, gl.NONE);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, bmp);
    const fb = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    const out = new Uint8Array(bmp.width * bmp.height * 4);
    gl.readPixels(0, 0, bmp.width, bmp.height, gl.RGBA, gl.UNSIGNED_BYTE, out);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.deleteFramebuffer(fb); gl.deleteTexture(tex); bmp.close();
    renderer.resetState();
    return out;
  };
  const n = meta.count, { mins, maxs } = meta.means;
  const [ml, mu, sh, sc] = [await pixels(meta.means.files[0]), await pixels(meta.means.files[1]), await pixels(meta.sh0.files[0]), await pixels(meta.scales.files[0])];
  const cb = meta.sh0.codebook, scb = meta.scales.codebook, C0 = 0.28209479177387814;
  const pos = new Float32Array(n * 3), col = new Float32Array(n * 3), op = new Float32Array(n), size = new Float32Array(n);
  for (let i = 0; i < n; i++){
    const s = [0, 0, 0];
    for (let a = 0; a < 3; a++){
      const v = mins[a] + (maxs[a] - mins[a]) * (((mu[i*4+a] << 8) | ml[i*4+a]) / 65535);
      pos[i*3+a] = Math.sign(v) * (Math.exp(Math.abs(v)) - 1);
      col[i*3+a] = Math.min(1, Math.max(0, 0.5 + C0 * cb[sh[i*4+a]]));
      s[a] = Math.exp(scb[sc[i*4+a]]);
    }
    s.sort((x, y) => y - x);
    op[i] = sh[i*4+3] / 255;
    size[i] = Math.sqrt(s[0] * s[1]);          // footprint of the flattened disc
  }
  return { count:n, pos, col, op, size };
}

async function unzip(u8){
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength), out = {};
  let e = u8.length - 22; while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
  if (e < 0) return out;
  let p = dv.getUint32(e + 16, true); const count = dv.getUint16(e + 10, true);
  for (let i = 0; i < count; i++){
    const method = dv.getUint16(p + 10, true), size = dv.getUint32(p + 20, true);
    const nl = dv.getUint16(p + 28, true), xl = dv.getUint16(p + 30, true), cl = dv.getUint16(p + 32, true), off = dv.getUint32(p + 42, true);
    const name = new TextDecoder().decode(u8.subarray(p + 46, p + 46 + nl));
    const data = off + 30 + dv.getUint16(off + 26, true) + dv.getUint16(off + 28, true);
    let body = u8.subarray(data, data + size);
    if (method === 8) body = new Uint8Array(await new Response(new Blob([body]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer());
    out[name] = body;
    p += 46 + nl + xl + cl;
  }
  return out;
}

function abort(){ document.documentElement.classList.remove('intro-pending'); }
